<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Honeycomb hex backdrop -->
    <polygon points="256,70 340,118 340,214 256,262 172,214 172,118" fill="url(#combGrad)" stroke="#b45309" stroke-width="6" />
    <polygon points="172,214 256,262 256,358 172,406 88,358 88,262" fill="url(#combGrad)" stroke="#b45309" stroke-width="6" />
    <polygon points="340,214 424,262 424,358 340,406 256,358 256,262" fill="url(#combGrad)" stroke="#b45309" stroke-width="6" />

    <!-- Cute Honeybee in Center -->
    <!-- Wings -->
    <ellipse cx="210" cy="200" rx="42" ry="60" transform="rotate(-35 210 200)" fill="#ffffff" fill-opacity="0.85" stroke="#0284c7" stroke-width="4" />
    <ellipse cx="302" cy="200" rx="42" ry="60" transform="rotate(35 302 200)" fill="#ffffff" fill-opacity="0.85" stroke="#0284c7" stroke-width="4" />

    <!-- Bee body -->
    <ellipse cx="256" cy="270" rx="55" ry="75" fill="#1e293b" />
    <!-- Yellow stripes -->
    <path d="M 207 240 Q 256 250 305 240 L 308 260 Q 256 270 204 260 Z" fill="#facc15" />
    <path d="M 204 275 Q 256 288 308 275 L 305 295 Q 256 308 207 295 Z" fill="#facc15" />
    <path d="M 215 310 Q 256 322 297 310 L 290 325 Q 256 335 222 325 Z" fill="#facc15" />

    <!-- Stinger -->
    <polygon points="256,350 250,365 262,365" fill="#0f172a" />

    <!-- Head -->
    <circle cx="256" cy="180" r="32" fill="#1e293b" />
    <!-- Eyes -->
    <ellipse cx="242" cy="175" rx="6" ry="9" fill="#ffffff" />
    <circle cx="243" cy="176" r="4" fill="#0f172a" />
    <ellipse cx="270" cy="175" rx="6" ry="9" fill="#ffffff" />
    <circle cx="269" cy="176" r="4" fill="#0f172a" />

    <!-- Antennae -->
    <path d="M 246 155 Q 230 130 220 135" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="218" cy="136" r="6" fill="#f59e0b" />
    <path d="M 266 155 Q 282 130 292 135" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="294" cy="136" r="6" fill="#f59e0b" />
  </g>
</svg>
